[project]
name = "workbench"
version = "0.1.0"
description = "One window for the analyst: code, terminals, real Office documents, and Claude agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "structlog>=26.1.0",
    "watchfiles>=1.2.0",
    "pywinpty>=3.0.5; sys_platform == 'win32'",
    # COM automation + job objects for native Office hosting (M4). Windows-only,
    # like the feature: it starts a private Word/Excel, reads the frame HWND the
    # shell reparents, and holds the job object that guarantees the process is
    # reaped. Named as the COM route in ARCHITECTURE.md since the M4 direction
    # was set; ctypes would be the same calls with the bindings hand-written.
    "pywin32>=311; sys_platform == 'win32'",
    "pyjwt>=2.13.0",
    "httpx>=0.28.1",
    "claude-agent-sdk>=0.2.128",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pre-commit>=4.6.1",
    "pytest-timeout>=2.4.0",
]

[project.scripts]
workbench-server = "workbench_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/src/workbench_server"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["server/src", "server/tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "UP",          # pyupgrade
    "B",           # bugbear
    "SIM",         # simplify
    "ASYNC",       # async correctness
    "S",           # security (bandit)
    "RUF",         # ruff-native
]

[tool.ruff.lint.per-file-ignores]
"server/tests/**" = ["S101", "S105", "S106"]  # asserts + dummy secrets are the point of tests

[tool.mypy]
strict = true
files = ["server/src", "server/tests"]
mypy_path = "server/src"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "winpty.*",
    "claude_agent_sdk.*",
    # pywin32 ships no stubs; `types-pywin32` is a second package to keep in
    # step with the real one for modules we call fewer than twenty times.
    "pythoncom",
    "win32api",
    "win32com.*",
    "win32event",
    "win32gui",
    "win32job",
    "win32process",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["server/tests"]
asyncio_mode = "auto"
addopts = "-q"
