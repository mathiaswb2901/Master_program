[project]
name = "workbench"
version = "0.1.0"
description = "One window for the analyst: code, terminals, real Office documents, and Claude agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "structlog>=26.1.0",
    "watchfiles>=1.2.0",
    "pywinpty>=3.0.5; sys_platform == 'win32'",
    # COM automation + job objects for native Office hosting (M4). Windows-only,
    # like the feature: it starts a private Word/Excel, reads the frame HWND the
    # shell reparents, and holds the job object that guarantees the process is
    # reaped. Named as the COM route in ARCHITECTURE.md since the M4 direction
    # was set; ctypes would be the same calls with the bindings hand-written.
    "pywin32>=311; sys_platform == 'win32'",
    "pyjwt>=2.13.0",
    "httpx>=0.28.1",
    "claude-agent-sdk>=0.2.128",
    "tzdata>=2026.3",
    # The M6 reconciliation gate reads .xlsx cell values deterministically with no
    # Office installed — the whole reason the gate is CI-verifiable. openpyxl is the
    # standard pure-Python xlsx reader (no native build, no transitive weight of
    # note); hand-parsing the OOXML zip with the stdlib would reinvent it for no gain.
    # Read-only, data_only=True (the *cached computed* values, not formula strings).
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pre-commit>=4.6.1",
    "pytest-timeout>=2.4.0",
]

[project.scripts]
workbench-server = "workbench_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/src/workbench_server"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["server/src", "server/tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "UP",          # pyupgrade
    "B",           # bugbear
    "SIM",         # simplify
    "ASYNC",       # async correctness
    "S",           # security (bandit)
    "RUF",         # ruff-native
]

[tool.ruff.lint.per-file-ignores]
"server/tests/**" = ["S101", "S105", "S106"]  # asserts + dummy secrets are the point of tests

[tool.mypy]
strict = true
files = ["server/src", "server/tests"]
mypy_path = "server/src"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "winpty.*",
    "claude_agent_sdk.*",
    # pywin32 ships no stubs; `types-pywin32` is a second package to keep in
    # step with the real one for modules we call fewer than twenty times.
    "pythoncom",
    "win32api",
    "win32com.*",
    "win32con",
    "win32event",
    "win32file",
    "win32gui",
    "win32job",
    "win32process",
    # openpyxl ships no py.typed marker; `types-openpyxl` is a second package to keep
    # in step for a reader we call in one module.
    "openpyxl",
    "openpyxl.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["server/tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    # Per-test knobs for the `fleet` fixture in test_orchestrator.py: the budget,
    # the pool size, the session cap and the scripted worker's behaviour. A
    # marker rather than a parametrized fixture because each test wants exactly
    # one of them changed and the rest left at the shipped defaults.
    "fleet: options for the Mission Control fleet fixture",
]
