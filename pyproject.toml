[project]
name = "workbench"
version = "0.1.0"
description = "One window for the analyst: code, terminals, real Office documents, and Claude agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "structlog>=26.1.0",
    "watchfiles>=1.2.0",
    "pywinpty>=3.0.5; sys_platform == 'win32'",
    "pyjwt>=2.13.0",
    "httpx>=0.28.1",
    "claude-agent-sdk>=0.2.128",
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pre-commit>=4.6.1",
    "pytest-timeout>=2.4.0",
]

[project.scripts]
workbench-server = "workbench_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/src/workbench_server"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["server/src", "server/tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "UP",          # pyupgrade
    "B",           # bugbear
    "SIM",         # simplify
    "ASYNC",       # async correctness
    "S",           # security (bandit)
    "RUF",         # ruff-native
]

[tool.ruff.lint.per-file-ignores]
"server/tests/**" = ["S101", "S105", "S106"]  # asserts + dummy secrets are the point of tests

[tool.mypy]
strict = true
files = ["server/src", "server/tests"]
mypy_path = "server/src"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["winpty.*", "claude_agent_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["server/tests"]
asyncio_mode = "auto"
addopts = "-q"
