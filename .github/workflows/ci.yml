name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest

  ui:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        run: npm ci
        if: ${{ hashFiles('ui/package-lock.json') != '' }}
      - name: Lint
        run: npm run lint
        if: ${{ hashFiles('ui/package-lock.json') != '' }}
      - name: Tests
        run: npm run test
        if: ${{ hashFiles('ui/package-lock.json') != '' }}
      - name: Build
        run: npm run build
        if: ${{ hashFiles('ui/package-lock.json') != '' }}

  # The built UI against the real backend, with the scripted fake agent
  # (WORKBENCH_FAKE_AGENT=1) so chat, tool rows, permission prompts and plan
  # cards are exercised without a Claude login. Windows because the PTY is.
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sync backend dependencies
        run: uv sync --dev
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Install Playwright browser
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: E2E suite
        working-directory: ui
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ui/playwright-report
          retention-days: 7

  # The single check the master ruleset requires: green only when every job is green.
  quality-gate:
    runs-on: ubuntu-latest
    needs: [server, ui, e2e]
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "a required job did not succeed"; exit 1
            fi
          done
