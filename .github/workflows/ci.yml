name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest

  ui:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        run: npm ci
        if: ${{ hashFiles('ui/package-lock.json') != '' }}
      - name: Lint
        run: npm run lint
        if: ${{ hashFiles('ui/package-lock.json') != '' }}
      - name: Tests
        run: npm run test
        if: ${{ hashFiles('ui/package-lock.json') != '' }}
      - name: Build
        run: npm run build
        if: ${{ hashFiles('ui/package-lock.json') != '' }}

  # The built UI against the real backend, with the scripted fake agent
  # (WORKBENCH_FAKE_AGENT=1) so chat, tool rows, permission prompts and plan
  # cards are exercised without a Claude login. Windows because the PTY is.
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sync backend dependencies
        run: uv sync --dev
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Install Playwright browser
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: E2E suite
        working-directory: ui
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ui/playwright-report
          retention-days: 7

  # The Feel performance lane: the production build against a real backend in a
  # generated 5,005-file workspace (server/tests/perf_fixture.py), collecting
  # navigation/paint timing, event timing at durationThreshold 0, long tasks,
  # long animation frames and rAF frame intervals.
  #
  # Two steps, and the split is the reason the job exists in this shape:
  #
  #   * **Budgets (blocking)** — every test *without* the `@wallclock` tag.
  #     Those assertions count work: how many directories a request lists, how
  #     many full tree fetches twenty file changes cost. A count is the same
  #     number on a developer's laptop and on a throttled shared runner, so it
  #     can gate a merge without ever failing for a reason that is not the code.
  #   * **Timings (reported)** — the `@wallclock` tests, with
  #     `continue-on-error`. Cold-launch and frame-timing numbers on a shared
  #     runner are information, not a verdict. Blocking on them is precisely how
  #     a performance gate ends up switched off, and a switched-off gate defends
  #     nothing.
  #
  # Both reports are uploaded on every run, pass or fail: the numbers, not the
  # green tick, are what the next Feel PR is measured against. Note that the
  # server-side budgets (directory-listing counts) also run in the `server` job
  # as ordinary pytest — this job is the browser half.
  #
  # `WB_PERF_WORKSPACE` points both runs at one fixture: the generator's stamp
  # check makes the second reuse it instead of writing 5,105 files again. It is
  # set per step rather than on the job, because the `runner` context is not
  # available in a job-level `env:` — GitHub rejects the whole workflow file for
  # it, with no job ever starting.
  perf:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sync backend dependencies
        run: uv sync --dev
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Install Playwright browser
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Build UI
        working-directory: ui
        run: npm run build
      - name: Budgets (blocking)
        working-directory: ui
        env:
          WB_PERF_WORKSPACE: ${{ runner.temp }}\perf-fixture
        run: npx playwright test --config playwright.perf.config.ts --grep-invert "@wallclock"
      - name: Upload budget report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-budgets
          path: |
            ui/playwright-report-perf
            ui/perf-results
          retention-days: 7
      - name: Timings (reported, never blocking)
        working-directory: ui
        continue-on-error: true
        env:
          WB_PERF_WORKSPACE: ${{ runner.temp }}\perf-fixture
        run: npx playwright test --config playwright.perf.config.ts --grep "@wallclock"
      - name: Upload timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-timings
          path: |
            ui/playwright-report-perf
            ui/perf-results
          retention-days: 7

  # Does this PR touch the Tauri shell? A full Rust toolchain + tauri build is
  # minutes of windows-latest, so the desktop job below is skipped when nothing
  # under desktop/ changed. GitHub has no per-job `paths:` filter, hence this.
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          if echo "$changed" | grep -q '^desktop/'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

  desktop:
    runs-on: windows-latest
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Format check
        run: cargo fmt --check
      - name: Build
        run: cargo build --locked
      - name: Tests
        run: cargo test --locked

  # The single check the master ruleset requires: green only when every job is green.
  quality-gate:
    runs-on: ubuntu-latest
    needs: [changes, server, ui, e2e, perf, desktop]
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            # `skipped` is allowed for exactly one reason: `desktop` is
            # path-filtered. server/ui/e2e/perf/changes carry no `if:` and no
            # `needs:`, so they can never be skipped — unreachable there.
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "a required job did not succeed"; exit 1
            fi
          done
