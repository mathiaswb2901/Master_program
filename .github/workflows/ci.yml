name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The backend gate on all three desktop platforms. This is the lane that keeps
  # the PTY seam (`services/pty_manager.py` -> `pty_posix.py`) honest: the ubuntu
  # and macos legs are the only place the stdlib `pty.fork()` backend ever runs
  # for real. Windows-only pieces (pywinpty, pywin32/COM, winreg) are platform
  # markers in `pyproject.toml` and `skipif`s with honest reasons in the tests —
  # never a silently-narrowed assertion.
  #
  # `fail-fast: false` on purpose: when one OS breaks, the other two legs' results
  # are the diagnosis (is it POSIX, or is it macos-only?), so cancelling them
  # costs the information the matrix exists to produce.
  server:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        # `-rs` prints every skip *with its reason*. On a 3-OS matrix that is
        # the difference between "green" and "green, and here is exactly what
        # this platform did not run" — the honest scoping §C2 asks for, in the
        # log rather than in a PR description that will go stale.
        run: uv run pytest -rs

  # The UI gate on all three platforms too. Nothing in `ui/` is platform code,
  # which is exactly why it is worth matrixing: the things that break here are
  # case-sensitive imports (an `import './Foo'` that is really `foo.tsx` passes
  # on Windows and macOS and fails on linux) and path separators leaking into
  # build config — both invisible on a single-OS runner.
  ui:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        run: npm ci
        if: ${{ hashFiles('ui/package-lock.json') != '' }}
      - name: Lint
        run: npm run lint
        if: ${{ hashFiles('ui/package-lock.json') != '' }}
      - name: Tests
        run: npm run test
        if: ${{ hashFiles('ui/package-lock.json') != '' }}
      - name: Build
        run: npm run build
        if: ${{ hashFiles('ui/package-lock.json') != '' }}

  # The built UI against the real backend, with the scripted fake agent
  # (WORKBENCH_FAKE_AGENT=1) so chat, tool rows, permission prompts and plan
  # cards are exercised without a Claude login.
  #
  # **windows-latest only, and that is the honest scope** (M7 §C2). The suite
  # drives the native Office-host lifecycle through `WORKBENCH_OFFICE_FAKE=1`,
  # and the thing that fake stands in for — a real Word/Excel frame window
  # reparented into the Tauri shell — exists on no other OS. Matrixing this job
  # would buy a green tick for a feature the other two runners cannot have; a
  # tick like that is worse than no tick, because it reads as coverage.
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sync backend dependencies
        run: uv sync --dev
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Install Playwright browser
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: E2E suite
        working-directory: ui
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ui/playwright-report
          retention-days: 7

  # The Feel performance lane: the production build against a real backend in a
  # generated 5,005-file workspace (server/tests/perf_fixture.py), collecting
  # navigation/paint timing, event timing at durationThreshold 0, long tasks,
  # long animation frames and rAF frame intervals.
  #
  # Two steps, and the split is the reason the job exists in this shape:
  #
  #   * **Budgets (blocking)** — every test *without* the `@wallclock` tag.
  #     Those assertions count work: how many directories a request lists, how
  #     many full tree fetches twenty file changes cost. A count is the same
  #     number on a developer's laptop and on a throttled shared runner, so it
  #     can gate a merge without ever failing for a reason that is not the code.
  #   * **Timings (reported)** — the `@wallclock` tests, with
  #     `continue-on-error`. Cold-launch and frame-timing numbers on a shared
  #     runner are information, not a verdict. Blocking on them is precisely how
  #     a performance gate ends up switched off, and a switched-off gate defends
  #     nothing.
  #
  # Both reports are uploaded on every run, pass or fail: the numbers, not the
  # green tick, are what the next Feel PR is measured against. Note that the
  # server-side budgets (directory-listing counts) also run in the `server` job
  # as ordinary pytest — this job is the browser half.
  #
  # `WB_PERF_WORKSPACE` points both runs at one fixture: the generator's stamp
  # check makes the second reuse it instead of writing 5,105 files again. It is
  # set per step rather than on the job, because the `runner` context is not
  # available in a job-level `env:` — GitHub rejects the whole workflow file for
  # it, with no job ever starting.
  #
  # **One pinned OS, deliberately** (M7 §C2, `CLAUDE.md`): a fixture number is
  # only meaningful against the same runner that produced the last one. Three
  # runners would give three incomparable baselines and no trend, which is the
  # opposite of what a perf lane is for.
  perf:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sync backend dependencies
        run: uv sync --dev
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Install Playwright browser
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Build UI
        working-directory: ui
        run: npm run build
      - name: Budgets (blocking)
        working-directory: ui
        env:
          WB_PERF_WORKSPACE: ${{ runner.temp }}\perf-fixture
        run: npx playwright test --config playwright.perf.config.ts --grep-invert "@wallclock"
      - name: Upload budget report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-budgets
          path: |
            ui/playwright-report-perf
            ui/perf-results
          retention-days: 7
      - name: Timings (reported, never blocking)
        working-directory: ui
        continue-on-error: true
        env:
          WB_PERF_WORKSPACE: ${{ runner.temp }}\perf-fixture
        run: npx playwright test --config playwright.perf.config.ts --grep "@wallclock"
      - name: Upload timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-timings
          path: |
            ui/playwright-report-perf
            ui/perf-results
          retention-days: 7

  # Does this PR touch the Tauri shell? A full Rust toolchain + tauri build is
  # minutes of windows-latest, so the desktop job below is skipped when nothing
  # under desktop/ changed. GitHub has no per-job `paths:` filter, hence this.
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          if echo "$changed" | grep -q '^desktop/'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

  # windows-latest only: the shell's whole job is native Windows window hosting
  # (`SetParent` on a Word/Excel frame HWND, job objects, the close guard), and
  # `cargo test` includes the Office-host window tests that create real windows.
  # There is no cross-platform half worth a runner (M7 §C2).
  desktop:
    runs-on: windows-latest
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Format check
        run: cargo fmt --check
      - name: Build
        run: cargo build --locked
      - name: Tests
        run: cargo test --locked

  # The single check the master ruleset requires: green only when every job is green.
  #
  # `server` and `ui` are matrices now, and that changes nothing here: a matrix
  # job contributes **one** result to `needs`, the aggregate over its legs, and
  # that aggregate is `failure` if any leg failed — so one red ubuntu leg fails
  # the gate exactly like a red single-runner job used to. (`fail-fast: false`
  # only stops the *other* legs from being cancelled; it does not launder the
  # failure into a success.) `server/tests/test_ci_matrix.py` pins that shape.
  quality-gate:
    runs-on: ubuntu-latest
    needs: [changes, server, ui, e2e, perf, desktop]
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            # `skipped` is allowed for exactly one reason: `desktop` is
            # path-filtered. server/ui/e2e/perf/changes carry no `if:` and no
            # `needs:`, so they can never be skipped — unreachable there, and
            # `test_only_the_path_filtered_job_can_ever_be_skipped` fails the
            # build if a future edit hands one of them a condition.
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "a required job did not succeed"; exit 1
            fi
          done
